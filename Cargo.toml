[package]
name = "a16t"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local receive-only radio watchboard and transmission recorder"
publish = false

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "fs"] }
