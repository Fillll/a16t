name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 -m unittest discover -s receiver/tests -v
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_public.py
  radio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gnuradio python3-numpy
      - run: A16T_TEST_GNURADIO=1 /usr/bin/python3 -m unittest discover -s receiver/tests -v
